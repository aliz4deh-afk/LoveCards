name: love_cards
description: "A fun sex position scratch card app for couples."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # این کتابخانه برای افکت خراشیدن است
  scratcher: ^2.5.0
  # این کتابخانه برای مدیریت گرید (جدول) تصاویر است
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cover.png
    - assets/images/pos1.png
    - assets/images/pos2.png
    # ما بعداً ۴۰ تصویر را اینجا اضافه می‌کنیم
